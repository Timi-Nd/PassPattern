[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passpattern"
version = "0.1.0"
description = "Python research and reference implementation for password-pattern recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["password", "pattern-detection", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Timi-Nd/PassPattern"
Source = "https://github.com/Timi-Nd/PassPattern"
Issues = "https://github.com/Timi-Nd/PassPattern/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "passtext-native>=0.1.0,<0.2.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["passpattern*"]

[tool.setuptools.package-data]
passpattern = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "native: exercises the published passtext_native extension",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
warn_unreachable = true
